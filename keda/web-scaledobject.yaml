apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: petclinic-web-scaledobject
  namespace: petclinic
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: petclinic-web
  pollingInterval: 30
  cooldownPeriod: 60
  minReplicaCount: 2
  maxReplicaCount: 4
  triggers:
    # 1. AWS CloudWatch 트리거: ALB 타겟당 요청 수 기반 확장 (KEDA Pod Identity 권한 사용)
    - type: aws-cloudwatch
      metadata:
        namespace: AWS/ApplicationELB
        dimensionName: LoadBalancer;TargetGroup
        # 배포 후 생성된 ALB 및 TargetGroup 접미사로 교체 (예: app/k8s-petclini-...;targetgroup/k8s-petclini-...)
        dimensionValue: "${ALB_DIMENSION};${TG_DIMENSION}"
        metricName: RequestCountPerTarget
        targetMetricValue: "50"
        minMetricValue: "0"
        awsRegion: ap-northeast-2
        metricCollectionTime: "60"
        metricStat: Sum
        metricUnit: Count
        identityOwner: operator
    # 2. Cron 트리거: 평일 업무 시간(09:00 ~ 18:00 KST) 동안 최소 3개 복제본 유지
    - type: cron
      metadata:
        timezone: Asia/Seoul
        start: 0 9 * * 1-5
        end: 0 18 * * 1-5
        desiredReplicas: "3"
