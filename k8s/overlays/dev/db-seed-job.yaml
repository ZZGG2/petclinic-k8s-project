apiVersion: batch/v1
kind: Job
metadata:
  name: petclinic-db-seed
  namespace: petclinic
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: petclinic
        tier: db-seed
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: mysql:8.4
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: petclinic-config
          env:
            - name: DB_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: petclinic-db-secret
                  key: DB_ADMIN_USER
            - name: DB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: petclinic-db-secret
                  key: DB_ADMIN_PASSWORD
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: petclinic-db-secret
                  key: DB_PASSWORD
          # 관리자 계정으로 DDL + 초기 데이터 적재 후, WAS용 계정에는 DML 권한만 부여(최소 권한 원칙)
          command:
            - sh
            - -c
            - |
              set -e
              printf '[client]\npassword="%s"\n' "$DB_ADMIN_PASSWORD" > /tmp/admin.cnf
              until mysql --defaults-extra-file=/tmp/admin.cnf -h petclinic-db-0.petclinic-db -u "$DB_ADMIN_USER" -e "SELECT 1" >/dev/null 2>&1; do
                echo "Waiting for petclinic-db-0..."
                sleep 3
              done
              mysql --defaults-extra-file=/tmp/admin.cnf --default-character-set=utf8mb4 -h petclinic-db-0.petclinic-db -u "$DB_ADMIN_USER" < /seed/schema-and-seed.sql
              mysql --defaults-extra-file=/tmp/admin.cnf -h petclinic-db-0.petclinic-db -u "$DB_ADMIN_USER" -e "
                CREATE USER IF NOT EXISTS '${DB_USER}'@'%' IDENTIFIED BY '${DB_PASSWORD}';
                ALTER USER '${DB_USER}'@'%' IDENTIFIED BY '${DB_PASSWORD}';
                GRANT SELECT, INSERT, UPDATE, DELETE ON ${DB_NAME}.* TO '${DB_USER}'@'%';
                FLUSH PRIVILEGES;
              "
              echo "seed-done (dev)"
          volumeMounts:
            - name: sql
              mountPath: /seed
      volumes:
        - name: sql
          configMap:
            name: petclinic-db-seed-sql
