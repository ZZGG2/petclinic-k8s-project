# ==============================================================================
# prod 전용 패치: ExternalSecret이 읽는 Secrets Manager 키를 dev → prod 로 교체
#  - 대상: 이 overlay의 모든 ExternalSecret (kustomization.yaml 의 target: kind: ExternalSecret)
#  - JSON 6902 patch: 리스트(dataFrom)의 0번째 항목 값 하나만 정확히 바꿈
#  - petclinic/prod/db 의 DB_ADMIN_USER 는 RDS 마스터 계정(admin) → 예전 Secret 패치가 하던 일을 대신함
# ==============================================================================
- op: replace
  path: /spec/dataFrom/0/extract/key
  value: petclinic/prod/db
