# ==============================================================================
# [Stage 1 — MVP] 가장 단순한 3-Tier 개통용 올인원 매니페스트
# (Sidecar, Probe, Quota, StatefulSet, RDS, HPA, KEDA 없이 순수 3-Tier 연결만 검증)
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: petclinic
---
# 1. DB Tier (Stage 1용 기본 MySQL 파드 & Service)
apiVersion: v1
kind: Service
metadata:
  name: petclinic-db
  namespace: petclinic
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: petclinic
    tier: db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-db-mvp
  namespace: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic
      tier: db
  template:
    metadata:
      labels:
        app: petclinic
        tier: db
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "PetClinicAdmin#2026"
            - name: MYSQL_DATABASE
              value: "petclinic"
            - name: MYSQL_USER
              value: "petclinic"
            - name: MYSQL_PASSWORD
              value: "PetClinicApp#2026"
---
# 2. WAS Tier (Stage 1에서는 WAS 내장 초기화로 테이블 자동 생성 확인)
apiVersion: v1
kind: Service
metadata:
  name: petclinic-was
  namespace: petclinic
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: petclinic
    tier: was
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-was
  namespace: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic
      tier: was
  template:
    metadata:
      labels:
        app: petclinic
        tier: was
    spec:
      containers:
        - name: tomcat
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/petclinic-was:v1
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_OPTS
              value: >-
                -Dspring.profiles.active=jpa
                -Djdbc.url=jdbc:mysql://petclinic-db:3306/petclinic?useUnicode=true&characterEncoding=UTF-8
                -Djdbc.username=petclinic
                -Djdbc.password=PetClinicApp#2026
---
# 3. WEB Tier (Nginx 정적 서빙 + /petclinic/ 프록시)
apiVersion: v1
kind: Service
metadata:
  name: petclinic-web
  namespace: petclinic
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: petclinic
    tier: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-web
  namespace: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic
      tier: web
  template:
    metadata:
      labels:
        app: petclinic
        tier: web
    spec:
      containers:
        - name: nginx
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/petclinic-web:v1
          ports:
            - containerPort: 80
---
# 4. Gateway API (외부 접속 -> ALB -> petclinic-web:80)
#    ※ GatewayClass(alb)는 클러스터 공통 리소스라 gateway/00-gatewayclass.yaml 로 먼저 적용
#    LoadBalancerConfiguration: scheme 기본값이 internal 이라 internet-facing 명시
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: petclinic-alb-config
  namespace: petclinic
spec:
  scheme: internet-facing
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: petclinic-gateway
  namespace: petclinic
spec:
  gatewayClassName: alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: petclinic-alb-config
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: petclinic-route
  namespace: petclinic
spec:
  parentRefs:
    - name: petclinic-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: petclinic-web
          port: 80
---
# TargetGroupConfiguration: targetType 기본값이 instance(NodePort 필요)라 ClusterIP Service에 맞게 ip 지정
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: petclinic-web-tg
  namespace: petclinic
spec:
  targetReference:
    name: petclinic-web
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckPath: /healthz
