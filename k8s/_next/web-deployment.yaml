apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-web
  namespace: petclinic
  annotations:
    kubernetes.io/change-cause: "Initial deployment of petclinic-web v1"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: petclinic
      tier: web
  template:
    metadata:
      labels:
        app: petclinic
        tier: web
        version: v1
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: petclinic
              tier: web
      # 네이티브 사이드카 패턴 (initContainers + restartPolicy: Always)
      initContainers:
        - name: log-agent
          image: busybox:1.37
          restartPolicy: Always
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          command:
            - sh
            - -c
            - "touch /var/log/nginx/access.log; tail -F /var/log/nginx/access.log"
          volumeMounts:
            - name: logs
              mountPath: /var/log/nginx
      containers:
        - name: nginx
          image: "${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/petclinic-web:v1"
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: logs
              mountPath: /var/log/nginx
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: logs
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: petclinic-web-nginx
