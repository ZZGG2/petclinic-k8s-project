# ==============================================================================
# [Stage 4.5-2] SecretStore — "어디서 비밀 값을 가져오는가"
#  - AWS Secrets Manager (ap-northeast-2)
#  - auth 생략 → ESO 컨트롤러 파드의 AWS 자격 증명(EKS Pod Identity)을 그대로 사용
#  - 네임스페이스 범위(SecretStore) → petclinic 네임스페이스의 ExternalSecret만 이 저장소를 쓸 수 있음
# ==============================================================================
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: petclinic
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
