# ==============================================================================
# WAS DB 접속 설정 파일 (WEB-INF/classes/spring/data-access.properties 를 통째로 교체)
#  - [Stage 2]     jdbc.initLocation = empty.sql → WAS 자동 초기화 OFF (스키마/데이터는 Seed Job)
#  - [Stage 4.5-2] 비밀번호가 들어 있는 파일이라 Git에서 제거 → ESO 템플릿으로 "조립"
#                  Secrets Manager 의 DB_PASSWORD 만 끼워 넣고 나머지 줄은 여기 그대로
#                  {{ .DB_PASSWORD }} = ESO 템플릿 문법 (Go template) — Kustomize/envsubst는 건드리지 않음
# ==============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: petclinic-was-dbconfig
  namespace: petclinic
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: petclinic-was-dbconfig
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        data-access.properties: |
          jdbc.initLocation=file:/config/empty.sql
          jdbc.dataLocation=file:/config/empty.sql
          jpa.showSql=false
          jpa.database=MYSQL
          jdbc.driverClassName=com.mysql.cj.jdbc.Driver
          jdbc.url=jdbc:mysql://petclinic-db:3306/petclinic?useUnicode=true&characterEncoding=UTF-8
          jdbc.username=petclinic
          jdbc.password={{ .DB_PASSWORD }}
  dataFrom:
    - extract:
        key: petclinic/dev/db
