# ==============================================================================
# WAS DB 접속 설정 파일 (WEB-INF/classes/spring/data-access.properties 를 통째로 교체)
#  - Stage 1: jdbc.initLocation = schema.sql  → WAS가 기동할 때 직접 테이블 생성 (DDL 권한 필요)
#  - Stage 2: jdbc.initLocation = empty.sql   → WAS 자동 초기화 OFF, 스키마/데이터는 Seed Job이 담당
#             (WAS 계정은 DML 권한만 갖기 때문에 CREATE TABLE을 실행하면 오히려 실패함)
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: petclinic-was-dbconfig
  namespace: petclinic
type: Opaque
stringData:
  data-access.properties: |
    # <jdbc:initialize-database> 가 실행할 스크립트 → 아무 일도 하지 않는 SQL (ConfigMap petclinic-config 의 empty.sql)
    jdbc.initLocation=file:/config/empty.sql
    jdbc.dataLocation=file:/config/empty.sql
    jpa.showSql=false
    jpa.database=MYSQL
    jdbc.driverClassName=com.mysql.cj.jdbc.Driver
    # petclinic-db: dev는 Headless Service(StatefulSet), prod는 ExternalName(RDS) — 이름이 같아서 이 파일은 그대로
    jdbc.url=jdbc:mysql://petclinic-db:3306/petclinic?useUnicode=true&characterEncoding=UTF-8
    jdbc.username=petclinic
    jdbc.password=PetClinicApp#2026
