# ==============================================================================
# Gateway API (AWS Load Balancer Controller → ALB)
#   GatewayClass(alb, 클러스터 공통) → Gateway(ALB 1개 + 리스너) → HTTPRoute(경로 규칙) → Service
#   ※ Ingress 하나에 몰려 있던 설정(annotations)이 역할별 리소스로 분리됩니다.
#  [Stage 4.5-3] HTTPS 추가
#   - ${CERT_ARN}: ACM 인증서 ARN / ${DOMAIN}: zzgg2.cloud → 적용 시 envsubst(kapply)로 치환
#   - HTTP:80  → HTTPS 로 301 리다이렉트 (petclinic-http-redirect)
#   - HTTPS:443 → petclinic-web:80 (petclinic-route)
#   - Gateway 자체는 그대로 두고 리스너만 추가 → ALB가 새로 만들어지지 않아 주소 유지
# ==============================================================================

# 1) LoadBalancerConfiguration — ALB 자체 설정 (scheme, tags, 리스너별 인증서/TLS 정책)
#    ⚠️ scheme 기본값은 internal 이므로 외부 접속을 위해 internet-facing 명시 필수
#    ⚠️ LBC는 Gateway 리스너의 tls.certificateRefs 로 인증서를 받지 않음 → 여기서 ACM ARN 지정
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: petclinic-alb-config
  namespace: petclinic
spec:
  scheme: internet-facing
  tags:
    Project: petclinic-k8s
  listenerConfigurations:
    - protocolPort: HTTPS:443
      defaultCertificate: "${CERT_ARN}"
      sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06   # TLS 1.2 이상만 허용 (1.3 우선)
---
# 2) Gateway — 실제 ALB 1개 + HTTP:80 / HTTPS:443 리스너
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: petclinic-gateway
  namespace: petclinic
spec:
  gatewayClassName: alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: petclinic-alb-config
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
---
# 3-a) HTTPRoute (HTTP:80) — 모든 요청을 https://${DOMAIN} 으로 301 리다이렉트
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: petclinic-http-redirect
  namespace: petclinic
spec:
  parentRefs:
    - name: petclinic-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: "${DOMAIN}"   # ALB 기본 주소로 들어와도 인증서가 맞는 도메인으로 보냄
            statusCode: 301
---
# 3-b) HTTPRoute (HTTPS:443) — 라우팅 규칙 (모든 외부 트래픽은 WEB으로, /petclinic/ 은 Nginx가 WAS로 프록시)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: petclinic-route
  namespace: petclinic
spec:
  parentRefs:
    - name: petclinic-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: petclinic-web
          port: 80
---
# 4) TargetGroupConfiguration — 대상 그룹 설정 (기존 target-type, healthcheck-path 어노테이션 대체)
#    ⚠️ targetType 기본값은 instance 이므로 Pod IP 직행을 위해 ip 명시
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: petclinic-web-tg
  namespace: petclinic
spec:
  targetReference:
    name: petclinic-web
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckPath: /healthz
      healthCheckProtocol: HTTP
      matcher:
        httpCode: "200"
