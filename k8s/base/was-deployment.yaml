apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-was
  namespace: petclinic
  annotations:
    kubernetes.io/change-cause: "Initial deployment of petclinic-was v1"
spec:
  replicas: 2
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: petclinic
      tier: was
  template:
    metadata:
      labels:
        app: petclinic
        tier: was
        version: v1
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: petclinic
              tier: was
      containers:
        - name: tomcat
          # ECR 푸시 후 본인 계정의 ECR URI로 교체 (또는 kustomize images로 오버라이드)
          image: "${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/petclinic-was:v1"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 800m
              memory: 1Gi
          envFrom:
            - configMapRef:
                name: petclinic-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: petclinic-db-secret
                  key: DB_PASSWORD
            # datasource-config.xml의 system-properties-mode="OVERRIDE" 활용
            # 빈 SQL 파일(/config/empty.sql)을 지정하여 WAS 기동 시 자동 DDL/초기화 비활성화
            # ⚠️ JAVA_OPTS가 아닌 JDK_JAVA_OPTIONS 사용
            #   catalina.sh는 JAVA_OPTS를 eval로 펼치므로 URL의 '&'(백그라운드 실행), 비밀번호의 '#'(주석)이
            #   셸 문법으로 해석돼 JVM이 비정상 종료됨 → java 런처가 직접 읽는 JDK_JAVA_OPTIONS는 셸을 거치지 않음
            - name: JDK_JAVA_OPTIONS
              value: >-
                -Dspring.profiles.active=jpa
                -Djpa.database=MYSQL
                -Djdbc.driverClassName=com.mysql.cj.jdbc.Driver
                -Djdbc.url=jdbc:mysql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)?useUnicode=true&characterEncoding=UTF-8
                -Djdbc.username=$(DB_USER)
                -Djdbc.password=$(DB_PASSWORD)
                -Djdbc.initLocation=file:/config/empty.sql
                -Djdbc.dataLocation=file:/config/empty.sql
          volumeMounts:
            - name: empty-sql
              mountPath: /config
              readOnly: true
          # 1. Startup Probe: Tomcat & Spring 초기 기동 대기 (최대 120초)
          startupProbe:
            httpGet:
              path: /petclinic/resources/images/pets.png
              port: http
            periodSeconds: 5
            failureThreshold: 24
          # 2. Liveness Probe: DB를 거치지 않는 정적 리소스 확인 (DB 장애 시 재시작 폭풍 방지)
          livenessProbe:
            httpGet:
              path: /petclinic/resources/images/pets.png
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # 3. Readiness Probe: /petclinic/vets는 @Cacheable("vets")가 걸려 있으므로
          #    매번 실제 DB SELECT를 수행하는 /petclinic/owners?lastName= 경로로 검사
          readinessProbe:
            httpGet:
              path: /petclinic/owners?lastName=
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: empty-sql
          configMap:
            name: petclinic-config
            items:
              - key: empty.sql
                path: empty.sql
