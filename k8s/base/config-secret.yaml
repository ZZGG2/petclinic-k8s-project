apiVersion: v1
kind: ConfigMap
metadata:
  name: petclinic-config
  namespace: petclinic
data:
  # dev(Headless Service)와 prod(ExternalName Service) 모두 동일한 Service 이름 사용
  DB_HOST: "petclinic-db"
  DB_PORT: "3306"
  DB_NAME: "petclinic"
  # WAS 애플리케이션은 DML 권한만 가진 최소 권한 계정 사용
  DB_USER: "petclinic"
  # WAS 내장 <jdbc:initialize-database> 비활성화를 위한 빈 SQL 파일
  empty.sql: |
    SELECT 1;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: petclinic-web-nginx
  namespace: petclinic
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /petclinic/ {
            proxy_pass http://petclinic-was:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: petclinic-db-secret
  namespace: petclinic
type: Opaque
stringData:
  # WAS용 DML 전용 계정 비밀번호
  DB_PASSWORD: "PetClinicApp#2026"
  # Seed Job(DDL 및 초기 데이터 적재)용 관리자 계정 정보
  DB_ADMIN_USER: "root"
  DB_ADMIN_PASSWORD: "PetClinicAdmin#2026"
