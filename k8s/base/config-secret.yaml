apiVersion: v1
kind: ConfigMap
metadata:
  name: petclinic-config
  namespace: petclinic
data:
  # dev(Headless Service)와 prod(ExternalName Service) 모두 동일한 Service 이름 사용
  DB_HOST: "petclinic-db"
  DB_PORT: "3306"
  DB_NAME: "petclinic"
  # Seed Job / CronJob 이 사용하는 접속 정보 (WAS는 was-dbconfig-secret.yaml 의 properties 파일 사용)
  # WAS 애플리케이션은 DML 권한만 가진 최소 권한 계정 사용
  DB_USER: "petclinic"
  # WAS 내장 <jdbc:initialize-database> 비활성화를 위한 빈 SQL 파일
  empty.sql: |
    SELECT 1;
---
# ==============================================================================
# [Stage 4.5-2] Secret petclinic-db-secret 는 더 이상 Git에 없음
#  → AWS Secrets Manager 의 petclinic/dev/db (JSON) 를 ESO가 읽어 같은 이름의 Secret을 만들어 줌
#    JSON 키 = Secret 키: DB_ADMIN_USER / DB_ADMIN_PASSWORD / DB_PASSWORD
#  → 사용하는 쪽(StatefulSet, Seed Job, CronJob)은 secretKeyRef 그대로 → 수정 없음
# ==============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: petclinic-db-secret
  namespace: petclinic
spec:
  refreshInterval: 1h               # 1시간마다 Secrets Manager 값과 동기화
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: petclinic-db-secret       # 만들어질 K8s Secret 이름
    creationPolicy: Owner           # ExternalSecret을 지우면 Secret도 같이 삭제
  dataFrom:
    - extract:
        key: petclinic/dev/db       # JSON의 모든 키를 그대로 Secret 키로 (prod는 overlay에서 교체)
