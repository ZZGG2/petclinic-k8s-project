# ==============================================================================
# WEB (Nginx: / 정적 서빙 + /petclinic/ → petclinic-was:8080 프록시) — Stage 2 버전
#  - 설정(default.conf)은 이미지에 포함
#  - [Stage 3-1] liveness / readiness Probe 추가 (/healthz: Nginx가 직접 응답)
#  - [Stage 3-2] resources(requests/limits) 추가
#  - [Stage 3-3] replicas 2 + 무중단 롤링 전략 + AZ/노드 분산 (PDB는 pdb.yaml)
#  - [Stage 4-2] 파드 수는 KEDA가 관리 (ALB 요청 수 + 평일 업무시간 cron)
#  - [Stage 3-4] 네이티브 Sidecar(log-agent): emptyDir 공유 볼륨으로 Nginx 접속 로그 스트리밍
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-web
  namespace: petclinic
spec:
  # [Stage 4-2] replicas 는 KEDA(web-scaledobject.yaml)가 만든 HPA가 관리 → 매니페스트에서 제거
  # 롤링 업데이트 중에도 "준비된 파드 수"가 replicas 아래로 떨어지지 않게
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1             # 새 파드를 1개 먼저 띄우고
      maxUnavailable: 0       # 새 파드가 Ready 된 뒤에야 옛 파드를 내림
  selector:
    matchLabels:
      app: petclinic
      tier: web
  template:
    metadata:
      labels:
        app: petclinic
        tier: web
        version: v1
    spec:
      # [Stage 3-3] 파드를 AZ / 노드에 고르게 분산 (스케줄링 시점에만 적용, 이미 뜬 파드는 재배치 안 함)
      #  maxSkew 1: 가장 많은 곳과 가장 적은 곳의 파드 수 차이가 1을 넘지 않게
      #  ScheduleAnyway: 조건을 못 지켜도 일단 배치 (DoNotSchedule 이면 Pending)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: petclinic
              tier: web
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: petclinic
              tier: web
      # [Stage 3-4] 네이티브 Sidecar = initContainers + restartPolicy: Always (K8s 1.29+)
      #  - 일반 init 컨테이너와 달리 "끝나지 않고" 메인 컨테이너와 함께 계속 실행
      #  - 메인 컨테이너보다 먼저 시작, 파드 종료 시 메인 컨테이너가 끝난 뒤에 종료
      initContainers:
        - name: log-agent
          image: busybox:1.37
          restartPolicy: Always
          command: ["sh", "-c", "touch /var/log/nginx/access.log; exec tail -F /var/log/nginx/access.log"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: logs
              mountPath: /var/log/nginx
      containers:
        - name: nginx
          image: "${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/petclinic-web:v1"
          ports:
            - name: http
              containerPort: 80
          # nginx 이미지는 원래 access.log → /dev/stdout 심볼릭 링크
          # emptyDir을 /var/log/nginx 에 덮어 마운트하면 링크가 가려져 "실제 파일"로 기록됨 → Sidecar가 읽음
          volumeMounts:
            - name: logs
              mountPath: /var/log/nginx
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Nginx는 기동이 빨라서 startupProbe 불필요
          # /healthz 는 WAS로 프록시하지 않음 → WAS 장애가 WEB 재시작으로 번지지 않음
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
      volumes:
        # 파드 안 컨테이너끼리 공유하는 임시 디스크 (파드가 삭제되면 같이 사라짐)
        - name: logs
          emptyDir: {}
