# ==============================================================================
# WEB (Nginx: / 정적 서빙 + /petclinic/ → petclinic-was:8080 프록시) — Stage 2 버전
#  - 설정(default.conf)은 이미지에 포함
#  - Sidecar / Probe / resources / topologySpread 는 Stage 3 에서 추가 (k8s/_next 참고)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-web
  namespace: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic
      tier: web
  template:
    metadata:
      labels:
        app: petclinic
        tier: web
        version: v1
    spec:
      containers:
        - name: nginx
          image: "${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/petclinic-web:v1"
          ports:
            - name: http
              containerPort: 80
