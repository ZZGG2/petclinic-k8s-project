# ==============================================================================
# eksctl ClusterConfig "템플릿" — ${...} 값은 Bastion에서 envsubst로 치환해 사용
#   envsubst '${CLUSTER} ${REGION} ${VPC_ID} ${PUB_A} ${PUB_C} ${PRIV_NODE_A} ${PRIV_NODE_C}' \
#     < eks/cluster-config.yaml > eks/cluster.rendered.yaml
#   (원본은 수정하지 않으므로 git pull 충돌 없음 / *.rendered.yaml 은 .gitignore 대상)
# ==============================================================================
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ${CLUSTER}
  region: ${REGION}
  version: "1.36"
  tags:
    Project: petclinic-k8s
    # eksctl이 이 태그를 보고 공유 노드 SG에 karpenter.sh/discovery 태그를 자동으로 붙여줌
    karpenter.sh/discovery: ${CLUSTER}

# 콘솔에서 만든 기존 VPC/서브넷 사용 (eksctl이 새 VPC를 만들지 않음)
vpc:
  id: "${VPC_ID}"
  subnets:
    public:
      ap-northeast-2a: { id: "${PUB_A}" }
      ap-northeast-2c: { id: "${PUB_C}" }
    private:
      ap-northeast-2a: { id: "${PRIV_NODE_A}" }
      ap-northeast-2c: { id: "${PRIV_NODE_C}" }

iam:
  withOIDC: true   # IRSA(LBC) 및 Karpenter 설치에 필요

addonsConfig:
  autoApplyPodIdentityAssociations: true

autoModeConfig:
  enabled: false

# Karpenter "설치만" 해 둠 (IAM Role, SQS 큐, 컨트롤러 Helm 설치)
# NodePool/EC2NodeClass를 적용하기 전까지는 노드를 하나도 만들지 않음 → Stage 4에서 활성화
karpenter:
  version: "1.14.2"   # Karpenter 1.14.x = K8s 1.29~1.36 지원
  createServiceAccount: true
  withSpotInterruptionQueue: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: eks-pod-identity-agent
  - name: aws-ebs-csi-driver
  - name: metrics-server

managedNodeGroups:
  - name: ng-system
    instanceType: m7i-flex.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20
    privateNetworking: true
    subnets:
      - "${PRIV_NODE_A}"
      - "${PRIV_NODE_C}"
    labels:
      role: system
    # [Stage 1~3] Taint 없이 운영 → 앱 파드(WEB/WAS/DB)도 이 노드에서 실행
    # [Stage 4-3] 아래 Taint를 CLI(aws eks update-nodegroup-config)로 추가 → 앱 파드는 Karpenter 노드로 이동
    #             이 파일은 "현재 클러스터 상태"를 반영하도록 Taint를 기록해 둠
    #             (Stage 1부터 다시 재현할 때는 이 taints 블록을 빼고 생성)
    taints:
      - key: CriticalAddonsOnly
        value: "true"
        effect: NoSchedule
    tags:
      Project: petclinic-k8s
      NodeGroupRole: system
