apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Karpenter v1: amiSelectorTerms 필수 (alias로 최신 AL2023 EKS 최적화 AMI 자동 선택)
  amiSelectorTerms:
    - alias: al2023@latest
  # eksctl karpenter 섹션이 생성한 Karpenter 전용 노드 Role (클러스터 접근 권한 Access Entry 포함)
  role: "eksctl-KarpenterNodeRole-petclinic-eks"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "petclinic-eks"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "petclinic-eks"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        deleteOnTermination: true
  tags:
    Project: petclinic-k8s
    ManagedBy: karpenter
