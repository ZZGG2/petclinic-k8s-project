apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: petclinic-eks
  region: ap-northeast-2
  version: "1.36"
  tags:
    Project: petclinic-k8s
    Owner: student
    karpenter.sh/discovery: petclinic-eks

iam:
  withOIDC: true

addonsConfig:
  autoApplyPodIdentityAssociations: true

autoModeConfig:
  enabled: false

# Karpenter 컨트롤러용 IAM Role, Spot 중단 대응 SQS 큐 및 EventBridge 규칙 자동 생성
karpenter:
  version: "1.3.0"
  createServiceAccount: true
  withSpotInterruptionQueue: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: eks-pod-identity-agent
  - name: aws-ebs-csi-driver
  - name: metrics-server

managedNodeGroups:
  - name: ng-system
    instanceType: m7i-flex.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20
    privateNetworking: true
    labels:
      role: system
    taints:
      - key: CriticalAddonsOnly
        value: "true"
        effect: NoSchedule
    tags:
      Project: petclinic-k8s
      NodeGroupRole: system
